<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Al Rasa — Sales & Collection</title>
<style>
  :root{
    --bg:#0e1116; --s1:#161b22; --s2:#1c232d; --border:#2a323d;
    --ink:#e6edf3; --ink2:#9aa7b4; --ink3:#6b7783;
    --accent:#3b82f6; --accent-g:rgba(59,130,246,.15);
    --green:#22c55e; --green-b:rgba(34,197,94,.14);
    --amber:#f59e0b; --amber-b:rgba(245,158,11,.14);
    --red:#ef4444; --red-b:rgba(239,68,68,.14);
    --purple:#a855f7;
    --font:'SF Mono',ui-monospace,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --rl:12px; --rm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  input,select,textarea,button{font-family:inherit;font-size:14px;color:var(--ink)}
  input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--rm);padding:9px 11px;outline:none}
  input:focus,select,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:52px}
  label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
  .btn{border:none;border-radius:var(--rm);padding:9px 16px;font-weight:600;cursor:pointer;background:var(--s2);color:var(--ink);border:1px solid var(--border)}
  .btn:hover{opacity:.9}
  .btn-primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn-danger{background:transparent;border-color:var(--border);color:var(--red)}
  .btn-sm{padding:6px 12px;font-size:13px}
  .btn-xs{padding:4px 9px;font-size:12px}
  .screen{display:none;min-height:100vh}
  .screen.active{display:block}
  /* login / setup */
  .auth-wrap{max-width:380px;margin:0 auto;padding:10vh 1.25rem}
  .brand{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .brand span{color:var(--accent)}
  .auth-sub{color:var(--ink2);font-size:13px;margin:4px 0 1.5rem}
  .card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:1.1rem}
  .f{margin-bottom:.85rem}
  .err{color:var(--red);font-size:12px;margin-top:8px;display:none}
  /* app shell */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--s1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .topbar-l{display:flex;align-items:center;gap:10px;min-width:0}
  .chip{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:20px;background:var(--accent-g);color:var(--accent)}
  .clock{font-size:12px;color:var(--ink2)}
  .logout{font-size:12px;color:var(--ink3);cursor:pointer}
  .body{display:flex}
  .side{width:200px;flex-shrink:0;border-right:1px solid var(--border);padding:12px 8px;min-height:calc(100vh - 52px);position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
  .nav{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rm);cursor:pointer;color:var(--ink2);font-weight:500;font-size:13.5px}
  .nav:hover{background:var(--s2)}
  .nav.active{background:var(--accent-g);color:var(--accent)}
  .content{flex:1;padding:1.25rem;max-width:1000px;min-width:0}
  .ph{margin-bottom:1.1rem}
  .pt{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .ps{font-size:13px;color:var(--ink2);margin-top:3px}
  .page{display:none}
  .page.active{display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:1.1rem}
  .sc{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:14px}
  .sl{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
  .sv{font-size:24px;font-weight:800;margin-top:4px;font-family:var(--font)}
  .ss{font-size:11px;color:var(--ink3);margin-top:2px}
  .ct{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  td.num,th.num{text-align:right;font-family:var(--font)}
  .tbl-wrap{overflow-x:auto;background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:6px 10px}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .t-ok{background:var(--green-b);color:var(--green)}
  .t-am{background:var(--amber-b);color:var(--amber)}
  .t-rd{background:var(--red-b);color:var(--red)}
  .banner{padding:11px 15px;border-radius:var(--rm);font-size:13px;margin-bottom:1rem;display:flex;gap:8px}
  .b-am{background:var(--amber-b);border:1px solid rgba(245,158,11,.3);color:var(--amber)}
  .b-ok{background:var(--green-b);border:1px solid rgba(34,197,94,.3);color:var(--green)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--border);border-radius:var(--rm);padding:10px 18px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--red);color:var(--red)}
  .toast.ok{border-color:var(--green);color:var(--green)}
  /* busy indicators — the Sheets backend can take a couple of seconds */
  #progress{position:fixed;top:0;left:0;height:3px;width:100%;z-index:100;pointer-events:none;opacity:0;transition:opacity .15s;overflow:hidden}
  #progress.show{opacity:1}
  #progress::after{content:'';position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
  .overlay{position:fixed;inset:0;background:rgba(14,17,22,.82);display:none;align-items:center;justify-content:center;z-index:90}
  .overlay.show{display:flex}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay-txt{color:var(--ink2);font-size:13px;margin-top:14px;text-align:center}
  .overlay-sub{color:var(--ink3);font-size:11px;margin-top:5px;text-align:center}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  @media(max-width:720px){
    .side{width:128px;padding:10px 6px}
    .nav{font-size:12px;padding:8px 8px;gap:7px}
    .content{padding:1rem}
    .grid2,.grid3{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- SETUP (first run) -->
<div class="screen" id="screen-setup">
  <div class="auth-wrap">
    <div class="brand">Al&nbsp;Rasa <span>Collection</span></div>
    <p class="auth-sub">First-time setup — paste your Google Apps Script Web App URL.</p>
    <div class="card">
      <div class="f"><label>Apps Script URL (ends in /exec)</label><input id="setup-url" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <button class="btn btn-primary" style="width:100%" onclick="saveBackend()">Connect</button>
      <p class="err" id="setup-err"></p>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div class="screen" id="screen-login">
  <div class="auth-wrap">
    <div class="brand">Al&nbsp;Rasa <span>Collection</span></div>
    <p class="auth-sub">Al Rasa Pest Control — Sales & Collection</p>
    <div class="card">
      <div class="f"><label>Username</label><input id="l-user" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="f"><label>Password</label><input id="l-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:.9rem;cursor:pointer;font-weight:500">
        <input type="checkbox" id="l-stay" checked style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer">Stay signed in on this device
      </label>
      <button class="btn btn-primary" style="width:100%" id="login-btn" onclick="doLogin()">Sign In</button>
      <p class="err" id="l-err"></p>
      <p style="font-size:11px;color:var(--ink3);margin-top:14px;text-align:center;cursor:pointer" onclick="resetBackend()">⚙ Reconfigure</p>
    </div>
  </div>
</div>

<!-- APP -->
<div class="screen" id="screen-app">
  <div class="topbar">
    <div class="topbar-l">
      <span class="brand" style="font-size:16px">Al&nbsp;Rasa</span>
      <span class="chip" id="role-chip">—</span>
      <span class="clock" id="clock"></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-sm" onclick="sync()">↻</button>
      <span id="me-name" style="font-size:13px;font-weight:600"></span>
      <span class="logout" onclick="logout()">Sign out</span>
    </div>
  </div>
  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="progress"></div>
<div class="overlay" id="overlay">
  <div>
    <div class="spinner"></div>
    <div class="overlay-txt" id="overlay-txt">Loading…</div>
    <div class="overlay-sub" id="overlay-sub"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Baked in so staff never see the setup screen. A saved value (from the
// ⚙ Reconfigure link) takes priority, e.g. if the backend is ever redeployed.
const DEFAULT_BACKEND='https://script.google.com/macros/s/AKfycbx8CLQQWLKGpRI969XC2DHxHuib32nFOnlS6yrl-jJkQHGoJ4Cp6vxzzwSwcCy46As/exec';
function validBackend(u){ return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(String(u||'').trim()); }
// Ignore anything saved that isn't a proper /exec URL, so a stale or mistyped
// value can never shadow the working default.
let BACKEND_URL = (function(){
  const saved = localStorage.getItem('alrasa_url');
  if(saved && !validBackend(saved)) localStorage.removeItem('alrasa_url');
  return validBackend(saved) ? saved.trim() : DEFAULT_BACKEND;
})();
let AUTH = null;           // {username, password}
let DB = null;             // full dataset
let ME = null;             // {name, username, role}
let curPage = null;

const $ = id => document.getElementById(id);
function show(scr){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(scr).classList.add('active'); }
// Persistent inline form error — a toast alone is too easy to miss.
function formErr(id,msg){ const e=$(id); if(!e) return; e.textContent=msg||''; e.style.display=msg?'block':'none'; }
function toast(msg,type=''){ const t=$('toast'); t.textContent=msg; t.className='toast show '+type; setTimeout(()=>t.className='toast',2600); }
function money(n){ return (Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(){ const d=new Date(Date.now()+4*3600*1000); return d.toISOString().slice(0,10); } // Dubai
function yesterdayStr(){ const d=new Date(Date.now()+4*3600*1000-86400000); return d.toISOString().slice(0,10); }
function nowMins(){ const s=nowClock(); return +s.slice(0,2)*60 + +s.slice(3); }

// Live entry rules begin on this date; before it everything is open so the
// app can be trialled. Must match ENFORCE_FROM in Code.gs.
const ENFORCE_FROM='2026-08-04';   // rules go live Tue 4 Aug; today stays open
const INVOICE_CUTOFF=10*60, COLLECTION_CUTOFF=14*60;
// Sunday is off, so Saturday's work can't be entered the next morning. On
// Monday both Saturday and Sunday stay open until 11:00.
const MONDAY_CATCHUP=11*60;
function rulesLive(){ return todayStr()>=ENFORCE_FROM; }
function cutoffLabel(m){ const h=Math.floor(m/60), mm=m%60; return ((h%12)||12)+':'+(mm<10?'0'+mm:mm)+(h<12?' AM':' PM'); }
function isMondayToday(){ return new Date(todayStr()+'T12:00:00Z').getUTCDay()===1; }
function saturdayStr(){ const d=new Date(Date.parse(yesterdayStr()+'T12:00:00Z')-86400000); return d.toISOString().slice(0,10); }
// Earliest date still editable right now.
function windowMin(cutoff){
  if(!rulesLive()) return '';
  if(isMondayToday()) return nowMins()<MONDAY_CATCHUP ? saturdayStr() : todayStr();
  return nowMins()<cutoff ? yesterdayStr() : todayStr();
}
function windowNote(cutoff,label){
  if(!rulesLive()) return `Open entry until ${ENFORCE_FROM} — you can add any date while testing.`;
  if(isMondayToday()){
    return nowMins()<MONDAY_CATCHUP
      ? `It's Monday — you can still enter <strong>Saturday (${saturdayStr()})</strong> and <strong>Sunday (${yesterdayStr()})</strong> until <strong>${cutoffLabel(MONDAY_CATCHUP)}</strong>.`
      : `The weekend ${label} closed at ${cutoffLabel(MONDAY_CATCHUP)} this morning. Only <strong>today (${todayStr()})</strong> can be entered now.`;
  }
  return nowMins()<cutoff
    ? `You can still enter or correct <strong>yesterday (${yesterdayStr()})</strong> until <strong>${cutoffLabel(cutoff)}</strong> today.`
    : `Yesterday's ${label} closed at ${cutoffLabel(cutoff)}. Only <strong>today (${todayStr()})</strong> can be entered now.`;
}
// Data entry hasn't started yet if today is before the opening date — except
// during the trial period, when everything stays open for testing.
function entryOpen(){ return !rulesLive() || todayStr()>=openingDate(); }
function notYetBanner(){ return `<div class="banner b-am"><span>📅</span><span>Data entry begins on <strong>${openingDate()}</strong>. Everything before that date is covered by the opening balance.</span></div>`; }
function nowClock(){ const d=new Date(Date.now()+4*3600*1000); return d.toISOString().slice(11,16); }

// Busy indicators. Any request shows the thin top bar; slow/blocking steps
// (login, first load) also show the full overlay.
let busy=0, writing=false;
function setBusy(on){
  busy += on?1:-1; if(busy<0) busy=0;
  const p=$('progress'); if(p) p.classList.toggle('show', busy>0);
}
function overlay(show,txt,sub){
  const o=$('overlay'); if(!o) return;
  if(txt!==undefined) $('overlay-txt').textContent=txt;
  $('overlay-sub').textContent = show ? (sub||'') : '';
  o.classList.toggle('show', !!show);
}

// ── Offline cache ────────────────────────────────────────────
// Apps Script is slow and occasionally stalls, so keep the last good
// dataset locally. The app opens instantly on it and refreshes behind the
// scenes; a failed refresh leaves the cached view in place.
function cacheKey(){ return AUTH ? 'alrasa_db_'+AUTH.username : null; }
function saveCache(){
  try{ const k=cacheKey(); if(k&&DB) localStorage.setItem(k, JSON.stringify({at:Date.now(), db:DB})); }catch(_){}
}
function loadCache(){
  try{
    const k=cacheKey(); if(!k) return null;
    const raw=localStorage.getItem(k); if(!raw) return null;
    const o=JSON.parse(raw);
    return (o&&o.db&&o.db.me)?o:null;
  }catch(_){ return null; }
}
function staleNote(at){
  const mins=Math.round((Date.now()-at)/60000);
  if(mins<1) return '';
  if(mins<60) return `Showing data from ${mins} min ago — refreshing…`;
  const h=Math.round(mins/60);
  return `Showing data from ${h} hour${h>1?'s':''} ago — refreshing…`;
}

async function api(action, params={}){
  if(!BACKEND_URL) throw new Error('No backend configured');
  const body = new URLSearchParams();
  body.append('action', action);
  if(AUTH){ body.append('username', AUTH.username); body.append('password', AUTH.password); }
  for(const k in params){ const v=params[k]; body.append(k, typeof v==='object'?JSON.stringify(v):v); }
  const isWrite=/^(upsert|add|delete|set)/.test(action);
  setBusy(true); if(isWrite) writing=true;
  try{
    // Apps Script intermittently answers with a 404 HTML page instead of
    // JSON. Retry a couple of times so users never see that as an error.
    let lastErr=null;
    for(let attempt=1; attempt<=3; attempt++){
      // Hard timeout per attempt — without this a stalled request hangs
      // forever and the retries stack up into a minute-plus wait.
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 12000);
      try{
        const res = await fetch(BACKEND_URL, { method:'POST', body, signal: ctrl.signal });
        const text = await res.text();
        let json=null;
        try{ json = JSON.parse(text); }catch(_){ json=null; }
        if(json){
          if(json.error) throw new Error(json.error);   // real API error: don't retry
          return json;
        }
        lastErr = new Error('The server did not respond properly.');
      }catch(e){
        if(e && e.name==='AbortError') lastErr = new Error('The server took too long to respond. Please try again.');
        else if(e && e.message && !/did not respond properly/.test(e.message)) throw e;
        else lastErr = e;
      } finally { clearTimeout(timer); }
      if(attempt<3) await new Promise(r=>setTimeout(r, 500));
    }
    throw lastErr || new Error('The server did not respond. Please try again.');
  } finally { setBusy(false); if(isWrite) writing=false; }
}

// ---- setup / auth ----
function saveBackend(){
  const url = $('setup-url').value.trim();
  const err = $('setup-err'); err.style.display='none';
  if(!validBackend(url)){ err.textContent='Paste a valid Apps Script Web App URL ending in /exec.'; err.style.display='block'; return; }
  BACKEND_URL = url; localStorage.setItem('alrasa_url', url);
  show('screen-login');
}
function resetBackend(){
  if(!confirm('Reconfigure the server URL? Only do this if you have been given a new one.')) return;
  localStorage.removeItem('alrasa_url');
  BACKEND_URL='';                    // force the setup screen
  show('screen-setup');
}
async function doLogin(){
  const username = $('l-user').value.trim(), password = $('l-pass').value;
  const err = $('l-err'); err.style.display='none';
  if(!username||!password){ err.textContent='Enter username and password.'; err.style.display='block'; return; }
  const btn = $('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  overlay(true, 'Signing in…', '');
  try{
    // Prefer the single round trip, but fall back to the original two-step
    // flow so the app works whether or not the backend has been updated.
    let r=null, fast=true;
    try{ r = await api('loginFull', { username, password }); }
    catch(e){ if(/unknown action/i.test(e.message)) fast=false; else throw e; }
    if(!fast){ r = await api('login', { username, password }); }
    if(!r || !r.ok){ err.textContent=(r&&r.error)||'Login failed.'; err.style.display='block'; return; }
    AUTH = { username, password };
    // "Stay signed in" keeps the session across browser restarts
    // (localStorage); otherwise it lasts only for this tab (sessionStorage).
    const stay = $('l-stay') && $('l-stay').checked;
    (stay ? localStorage : sessionStorage).setItem('alrasa_auth', JSON.stringify(AUTH));
    (stay ? sessionStorage : localStorage).removeItem('alrasa_auth');
    if(fast && r.me){ DB = r; ME = r.me; saveCache(); }
    else { overlay(true,'Loading your data…','Almost there…'); await sync(); }
    if(!DB || !ME){ err.textContent='Could not load your data. Please try again.'; err.style.display='block'; return; }
    launch();
  }catch(e){ err.textContent='Error: '+e.message; err.style.display='block'; }
  finally{ btn.disabled=false; btn.textContent='Sign In'; overlay(false); }
}
function logout(){ try{ const k=cacheKey(); if(k) localStorage.removeItem(k); }catch(_){} AUTH=null; DB=null; ME=null; sessionStorage.removeItem('alrasa_auth'); localStorage.removeItem('alrasa_auth'); show('screen-login'); $('l-pass').value=''; }

async function sync(){
  try{ DB = await api('getAll'); ME = DB.me; saveCache(); if(curPage) renderPage(curPage); return DB; }
  catch(e){ toast('Sync failed: '+e.message,'err'); if(String(e.message)==='auth') logout(); }
}

// ---- app shell ----
// Sales people who also handle collection + cheques (usernames, lower-case).
// Must match COLLECTION_USERS in Code.gs.
const COLLECTION_USERS=['christo'];
function canCollect(){ return !!ME && (ME.role==='accountant' || COLLECTION_USERS.indexOf(String(ME.username).toLowerCase())!==-1); }

const NAV = {
  neethu:    [['invoicing','🧾 Invoicing']],
  accountant:[['collection','💵 Collection'],['cheques','🏦 Cheques']],
  sales:     [['mysales','💼 My Sales']],
  owner:     [['dashboard','📊 Dashboard'],['tbc','📈 To Be Collected'],['salesteam','💼 Sales Team'],['invoicing','🧾 Invoicing'],['collection','💵 Collection'],['cheques','🏦 Cheques'],['settings','⚙ Settings']]
};
function launch(){
  show('screen-app');
  $('role-chip').textContent = ME.role;
  $('me-name').textContent = ME.name;
  let nav = (NAV[ME.role] || []).slice();
  // A sales person who also does collection gets those tabs as well.
  if(ME.role==='sales' && canCollect()) nav = nav.concat([['collection','💵 Collection'],['cheques','🏦 Cheques']]);
  $('side').innerHTML = nav.map(([id,label])=>`<div class="nav" id="nav-${id}" onclick="go('${id}')">${label}</div>`).join('');
  go(nav[0][0]);
}
function go(page){
  curPage = page;
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  const n=$('nav-'+page); if(n) n.classList.add('active');
  renderPage(page);
}
function renderPage(page){
  const el = $('content');
  const R = { invoicing:renderInvoicing, collection:renderCollection, cheques:renderCheques, dashboard:renderDashboard, tbc:renderTbc, settings:renderSettings, mysales:renderMySales, salesteam:renderSalesTeam };
  (R[page]||(()=>el.innerHTML=''))(el);
}

// ---- helpers over DB ----
function invRow(date){ return (DB.invoices||[]).find(i=>i.date===date); }
function colRow(date){ return (DB.collection||[]).find(c=>c.date===date); }
function invTotal(date){ const r=invRow(date); return r?(+r.al+ +r.an+ +r.ho):0; }
function colTotal(date){ const r=colRow(date); return r?(+r.cash+ +r.bank):0; }
function openingBalance(){ return +(DB.config.openingBalance||0); }
function openingDate(){ return DB.config.openingDate||'2026-08-01'; }

function tbc(){
  const od = openingDate();
  const dates = new Set();
  (DB.invoices||[]).forEach(i=>{ if(i.date>=od) dates.add(i.date); });
  (DB.collection||[]).forEach(c=>{ if(c.date>=od) dates.add(c.date); });
  const sorted=[...dates].sort();
  let bal=openingBalance(); const rows=[];
  sorted.forEach(d=>{ const inv=invTotal(d), col=colTotal(d); bal+=inv-col; rows.push({date:d,inv,col,bal}); });
  return { rows, closing:bal };
}

function loadInvDate(){
  if(!$('inv-date')) return;
  const d=$('inv-date').value; const r=invRow(d);
  $('inv-hint').textContent = r?`Editing existing entry (last by ${r.updatedBy||'—'})`:'New entry';
  $('inv-al').value = r?r.al:''; $('inv-an').value=r?r.an:''; $('inv-ho').value=r?r.ho:''; $('inv-note').value='';
}
function editInv(date){ $('inv-date').value=date; loadInvDate(); $('inv-note').focus(); window.scrollTo(0,0); }
async function saveInvoice(){
  if(writing) return;
  const date=$('inv-date').value, al=$('inv-al').value||0, an=$('inv-an').value||0, ho=$('inv-ho').value||0, note=$('inv-note').value.trim();
  const fail=m=>{ formErr('inv-err',m); toast(m,'err'); };
  if(!date){ fail('Pick a date.'); return; }
  if(ME.role==='neethu' && rulesLive()){
    if(date<openingDate()){ fail('Entries start from '+openingDate()+'.'); return; }
    const mn=windowMin(INVOICE_CUTOFF);
    if(date<mn||date>todayStr()){ fail(nowMins()<INVOICE_CUTOFF?`Only ${yesterdayStr()} or ${todayStr()} can be entered now.`:`Yesterday closed at ${cutoffLabel(INVOICE_CUTOFF)} — only today can be entered.`); return; }
  }
  formErr('inv-err','');
  // The note is optional — every change is recorded in the audit log anyway,
  // and blocking the save here once cost a real entry.
  try{
    await api('upsertInvoice',{date,al,an,ho,note,reason:note});
    await sync();
    formErr('inv-err','');
    toast(`Saved ✅  ${date}: total ${money((+al)+(+an)+(+ho))}`,'ok');
  }
  catch(e){ formErr('inv-err','Not saved — '+e.message); toast('Not saved: '+e.message,'err'); }
}

function renderSalesTeam(el){
  const all = DB.sales||[];
  const month = (el.dataset.month)|| todayStr().slice(0,7);
  const rows = all.filter(s=>String(s.date).slice(0,7)===month);
  const byPerson = {};
  rows.forEach(s=>{
    const k=s.userName||s.userId;
    byPerson[k] = byPerson[k]||{q:0,n:0,c:0,r:0,days:0};
    byPerson[k].q+=+s.quotation||0; byPerson[k].n+=+s.quotCount||0; byPerson[k].c+=+s.converted||0;
    if(s.received) byPerson[k].r+=+s.converted||0;
    byPerson[k].days++;
  });
  const people = Object.entries(byPerson).sort((a,b)=>b[1].c-a[1].c);
  const totQ=rows.reduce((s,r)=>s+(+r.quotation||0),0);
  const totN=rows.reduce((s,r)=>s+(+r.quotCount||0),0);
  const totC=rows.reduce((s,r)=>s+(+r.converted||0),0);
  const totR=rows.filter(r=>r.received).reduce((s,r)=>s+(+r.converted||0),0);
  el.innerHTML = `
    <div class="ph"><div class="pt">Sales Team</div><div class="ps">Quotations, conversions and money received by each sales person.</div></div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:1rem">
      <label style="margin:0">Month</label><input type="month" id="st-month" value="${month}" style="width:auto" onchange="document.getElementById('content').dataset.month=this.value;renderSalesTeam(document.getElementById('content'))">
    </div>
    <div class="sg">
      <div class="sc"><div class="sl">Quotations made</div><div class="sv">${totN}</div></div>
      <div class="sc"><div class="sl">Quoted</div><div class="sv" style="color:var(--accent)">${money(totQ)}</div></div>
      <div class="sc"><div class="sl">Converted</div><div class="sv" style="color:var(--green)">${money(totC)}</div></div>
      <div class="sc"><div class="sl">Received</div><div class="sv">${money(totR)}</div></div>
      <div class="sc"><div class="sl">Awaiting payment</div><div class="sv" style="color:var(--amber)">${money(totC-totR)}</div></div>
      <div class="sc"><div class="sl">Conversion</div><div class="sv">${totQ>0?Math.round(totC/totQ*100):0}%</div><div class="ss">converted ÷ quoted</div></div>
    </div>
    <div class="tbl-wrap" style="margin-bottom:1rem"><div class="ct" style="padding:6px 4px 0">By person — ${month}</div>
      <table><thead><tr><th>Sales person</th><th class="num"># Quots</th><th class="num">Quoted</th><th class="num">Converted</th><th class="num">Received</th><th class="num">Pending</th><th class="num">Conv %</th></tr></thead><tbody>
      ${people.length?people.map(([n,v])=>`<tr><td style="font-weight:600">${esc(n)}</td><td class="num">${v.n}</td><td class="num">${money(v.q)}</td><td class="num" style="font-weight:700">${money(v.c)}</td><td class="num" style="color:var(--green)">${money(v.r)}</td><td class="num" style="color:var(--amber)">${money(v.c-v.r)}</td><td class="num">${v.q>0?Math.round(v.c/v.q*100):0}%</td></tr>`).join(''):`<tr><td colspan="7" style="color:var(--ink3);text-align:center;padding:1.5rem">No sales entries this month.</td></tr>`}
    </tbody></table></div>
    <div class="tbl-wrap"><div class="ct" style="padding:6px 4px 0">Daily entries</div>
      <table><thead><tr><th>Date</th><th>Sales person</th><th class="num"># Quots</th><th class="num">Quotation</th><th class="num">Converted</th><th>Received</th></tr></thead><tbody>
      ${rows.length?[...rows].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(s=>`<tr><td>${s.date}</td><td>${esc(s.userName||'')}</td><td class="num">${+s.quotCount||0}</td><td class="num">${money(s.quotation)}</td><td class="num">${money(s.converted)}</td><td><span class="tag ${s.received?'t-ok':'t-am'}">${s.received?'✓ Received':'Pending'}</span></td></tr>`).join(''):`<tr><td colspan="6" style="color:var(--ink3);text-align:center;padding:1.5rem">No entries.</td></tr>`}
    </tbody></table></div>`;
}

// ---- SETTINGS (owner) ----
function renderSettings(el){
  const users = DB.users||[];
  el.innerHTML = `
    <div class="ph"><div class="pt">Settings</div><div class="ps">Opening balance and logins.</div></div>
    <div class="card" style="margin-bottom:1rem">
      <div class="ct">Opening balance (to be collected as of the start date)</div>
      <div class="grid2">
        <div class="f"><label>Start date</label><input type="date" id="set-odate" value="${openingDate()}"></div>
        <div class="f"><label>Opening amount (AED)</label><input type="number" id="set-obal" step="0.01" value="${openingBalance()}"></div>
      </div>
      <button class="btn btn-primary" onclick="saveOpening()">Save opening</button>
    </div>
    <div class="card">
      <div class="ct">Logins</div>
      <div class="tbl-wrap" style="border:none;padding:0"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr></thead><tbody>
        ${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td><span class="tag t-ok">${esc(u.role)}</span></td><td><button class="btn btn-xs" onclick="resetPass('${u.id}','${esc(u.name)}')">Reset password</button></td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
}
async function saveOpening(){
  try{
    await api('setConfig',{key:'openingDate',value:$('set-odate').value});
    await api('setConfig',{key:'openingBalance',value:$('set-obal').value||0});
    await sync(); toast('Opening saved ✅','ok');
  }catch(e){ toast('Failed: '+e.message,'err'); }
}
async function resetPass(id,name){
  const pass = prompt('New password for '+name+':'); if(!pass) return;
  try{ await api('saveUser',{data:{id,password:pass}}); toast('Password updated ✅','ok'); }
  catch(e){ toast('Failed: '+e.message,'err'); }
}

// ---- boot ----
function tick(){ $('clock').textContent = nowClock() + ' · ' + todayStr(); }
setInterval(tick,20000); tick();
(function boot(){
  const savedAuth = localStorage.getItem('alrasa_auth') || sessionStorage.getItem('alrasa_auth');
  if(!BACKEND_URL){ show('screen-setup'); return; }
  if(savedAuth){
    AUTH = JSON.parse(savedAuth);
    const cached = loadCache();
    if(cached){
      // Instant open on the last known data, then refresh in the background.
      DB = cached.db; ME = DB.me;
      launch();
      const note = staleNote(cached.at);
      if(note) toast(note);
      sync().catch(()=>toast('Could not refresh — showing saved data.','err'));
    } else {
      show('screen-login');
      overlay(true,'Loading…','');
      sync()
        .then(()=>{ if(DB&&ME) launch(); else show('screen-login'); })
        .catch(()=>show('screen-login'))
        .finally(()=>overlay(false));
    }
  }
  else show('screen-login');
})();
</script>
</body>
</html>
